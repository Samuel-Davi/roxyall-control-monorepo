packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false

ignoredBuiltDependencies:
  - core-js
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - esbuild
  - prisma
  - sharp
